<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Arkhivinos</title>
    <link rel="stylesheet" href="base.css">
</head>

<body class="paginaLogin">
    <main class="cartaoLogin">
        <header>
            <img src="img/IFPR.png" alt="IFPR logo" class="logoIF">
            <h1 id="NomeProjeto"><img src="img/arkhivinos.png" alt="Arkhivinos" class="logoArk"></h1>
        </header>

        <div class="botoes">
            <button type="button" onclick="mostrarLogin()" id="btnLogin" class="ativo">Entrar</button>
            <button type="button" onclick="mostrarCadastro()" id="btnCadastro">Cadastrar</button>
        </div>

        <form id="formLogin" class="formulario">
            <h2>Entrar</h2>
            <input type="email" id="loginEmail" placeholder="Seu e-mail" aria-label="E-mail" required>
            <input type="password" id="loginSenha" placeholder="Sua senha" aria-label="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <form id="formCadastro" class="formulario escondido">
            <h2>Criar Conta</h2>
            <input type="text" id="cadastroNome" placeholder="Seu nome" aria-label="Nome" required>
            <input type="email" id="cadastroEmail" placeholder="Seu e-mail" aria-label="E-mail" required>
            <input type="password" id="cadastroSenha" placeholder="Crie uma senha (mínimo 6 caracteres)" aria-label="Senha" required>
            <button type="submit">Cadastrar</button>
        </form>

        <a href="index.html" class="voltarSite" onclick="try { sessionStorage.setItem('visitante', 'sim'); } catch (e) { }">Continuar sem entrar &rarr;</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
